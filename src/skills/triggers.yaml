# graduation-kit 触发路由表（紧凑版）
#
# 成本原则：本文件是唯一“每次进入毕设流程都要读”的触发文件，控制在 1.5k tokens 内。
# 详细场景、handoff、冲突推演在 triggers.scenes.yaml，只在两个 skill 拿不准时再读。
#
# 加载层级
#   L0 常驻：各 skill 的 name + description（由编辑器提供，本表不增加常驻开销）
#   L1 命中：读本文件，决定加载哪个 SKILL.md
#   L2 按需：SKILL.md 的「文件索引」指向的 reference/*.md
#   L3 少见：拿不准时读 triggers.scenes.yaml

version: 2

# 范围门禁：先于关键词判定。非毕设项目一律不加载本表里的 skill。
scope:
  only_when: >
    用户明确提到毕设/毕业设计/论文/开题/答辩，
    或项目根目录存在 docs/scaffold_db.sql / 需求确认单.md
  outside: 非毕设项目：本表所有 skill 一律不加载。
  ambiguous: 判断不了就先问一句，不要默认启用。
  note: impeccable 是通用 UI skill，不受本门禁限制；其余 7 个受限制。

rules:
  - "strong 命中 1 个即激活；weak 需 2 个，或 1 个 weak + 1 个 context 词。"
  - "中英文均可，匹配时忽略大小写与常见标点。"
  - "not_for 命中优先于 strong，除非用户点名了 skill。"
  - "有 strong 命中的优先于只有 weak 的；同层再按 priority 从高到低。"
  - "只命中 context 词不激活，先问一句要做什么。"
  - "一次只加载命中的 skill，不要预读其余 SKILL.md。"

context: [毕设, 毕业设计, 毕业论文, 开题, 答辩, 导师, 论文, 课程设计, graduation, thesis, dissertation, defense]

skills:
  - id: graduation-project
    priority: 100
    when: 做毕设 / 开工 / 加模块 / 脚手架改造 / 答辩前总检
    strong: [做毕设, 开发毕业设计, 毕设项目, 写毕设代码, 毕业设计系统, 帮我开工, 基于脚手架开发, 继续做, graduation project, final year project, capstone project, build my project]
    weak: [毕设, 毕业设计, 项目, 技术选型, 脚手架, graduation, project]
    not_for: [纯写论文正文, 只要一张建表SQL, 只问一个接口, 只审一段代码]

  - id: thesis-writer
    priority: 90
    when: 写章节 / 摘要 / 改措辞 / 画论文配图 / 转 Word
    strong: [写论文, 写毕业论文, 写第X章, 写摘要, 改论文措辞, 降AI味, 转Word, 转docx, 论文配图, 画ER图, 画架构图, 画流程图, 画用例图, 画时序图, 画功能模块图, 画技术栈图, write thesis, thesis chapter, write abstract, convert to word, thesis figure]
    weak: [论文, 章节, 字数, 图注, 三线表, 开题报告, thesis, paper, chapter, abstract, docx]
    not_for: [写业务代码, 改数据库表, 设计接口, 前端样式调整]

  - id: literature-review
    priority: 85
    when: 找文献 / 查文献 / 检索文献 / 文献综述 / 补引用 / 核验文献真假
    strong: [找文献, 查文献, 文献检索, 检索文献, 文献综述, 补引用, 引用核验, 核实文献, 文献核验, 文献是不是真的, 文献不真实, 参考文献太少, find literature, search papers, literature review, verify references, citation check]
    weak: [文献, 引用, 参考文献, 期刊, doi, paper, reference, citation]
    not_for: [写正文, 画图, 转Word, 写业务代码]

  - id: feature-forge
    priority: 80
    when: 题目宽泛 / 定需求 / 列功能 / 砍范围 / 估工作量
    strong: [不知道毕设做什么, 题目太宽泛, 写需求文档, 需求确认单, 列功能清单, 功能清单, 定MVP, 工作量够不够, 开题报告需求分析, define requirements, feature list, scope my project, mvp]
    weak: [需求, 功能, 角色, 优先级, 范围, requirements, features, scope]
    not_for: [已给功能清单要直接写代码, 论文里的需求分析正文]

  - id: database-designer
    priority: 70
    when: 建表 / 改表 / 加索引 / ER 关系 / 数据字典
    strong: [建表, 设计数据库, 写建表SQL, DDL, 加字段, 改表结构, 加索引, 设计ER, 数据字典, create table, database schema, design database, add index, data dictionary]
    weak: [数据库, 表, 字段, 外键, 索引, 范式, database, table, schema, index]
    not_for: [写查询或统计SQL, 慢查询优化, 设计接口, 论文里的ER插图]

  - id: api-designer
    priority: 70
    when: 加接口 / 统一返回 / 错误码 / 分页 / 联调对不上
    strong: [加接口, 加个接口, 设计接口, 设计API, 接口文档, 请求响应格式, 返回结构, 统一返回, 错误码, 分页怎么写, 前后端联调, design api, add endpoint, api documentation, response format, error code, pagination]
    weak: [接口, API, REST, DTO, 路由, 参数, 鉴权, api, endpoint, rest, dto]
    not_for: [数据库表结构, 前端页面样式, 写后端实现代码]

  - id: code-reviewer
    priority: 60
    when: 审查代码 / 找 bug / 导师挑刺 / 答辩前检查
    strong: [审查代码, review一下, 代码审查, 代码质量, 找bug, 导师会不会挑刺, 答辩前, 审查一下, 安全检查, review code, review this code, code review, find bugs, code quality, security review]
    weak: [审查, 检查, 重构, 优化, 规范, 命名, review, refactor, lint]
    not_for: [需求讨论, 写新功能, 论文措辞]

  - id: impeccable
    priority: 50
    when: 界面难看 / 样式布局优化 / 配色 / 组件打磨
    strong: [界面不好看, 样式优化, 布局优化, 太杂乱, 没有设计感, 重新设计界面, 配色, 视觉层次, redesign the ui, improve layout, bad ui, fix the styling, color scheme]
    weak: [前端, 页面, 样式, 布局, 设计, 好看, ui, layout, styling, design]
    not_for: [后端代码, 数据库, 论文写作, 没有可运行的前端工程]

# 自动编排：命中入口后按 chain 的顺序自己往下跑，不要让用户再细分。
# chain 就是默认执行顺序；标 ? 的是条件触发（条件满足才跑）。
# 环节内部该确认的照确认（如需求单），不该问的直接做。
pipelines:
  - name: build
    entry: [做毕设, 开发毕业设计, 毕设项目, 写毕设代码, 加模块, 继续做]
    chain: [feature-forge, database-designer, api-designer, impeccable?, graduation-project, code-reviewer]
    tail: [thesis-writer]
    note: 阶段 1 需求单必须等用户点头，其余阶段自己推进；代码验收后主动问要不要进论文
  - name: thesis
    entry: [写论文, 写毕业论文, 写第X章, 写摘要, 转Word]
    chain: [literature-review, thesis-writer]
    note: 文献没备齐先自己去补，不要反问用户“文献定了吗”；写完自动跑两个校验再转 Word
  - name: defense
    entry: [答辩前, 答辩检查, 导师要检查]
    chain: [code-reviewer, graduation-project, thesis-writer]
    note: 代码、论文引用、图表编号一起过一遍，不要只查一样

conflicts:
  - "毕设 + 写代码/做系统 → graduation-project；毕设 + 写章节/画图/Word → thesis-writer。"
  - "需求没定只走 feature-forge；表定之后才 api-designer。"
  - "页面不存在先 graduation-project；能跑但难看才 impeccable。"
  - "审查不替代开发：code-reviewer 出问题后回当前阶段修，不另起流程。"

phase_map:
  phase_1_requirements: [feature-forge]
  phase_1_schema: [database-designer]
  phase_1_api: [api-designer]
  phase_1_style: [impeccable]
  phase_2_codegen: [graduation-project]
  phase_2_review: [code-reviewer]
  phase_3_literature: [literature-review]
  phase_3_thesis: [thesis-writer]
  phase_4_defense: [code-reviewer, graduation-project]
