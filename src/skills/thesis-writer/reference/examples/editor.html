<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>论文插图编辑器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    background: #eceff1;
    font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
    display: flex; flex-direction: column;
  }
  .bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 14px; background: #fff; border-bottom: 1px solid #d5d5d5;
  }
  select, button, input {
    padding: 7px 12px; font-size: 13px; border-radius: 4px;
    border: 1px solid transparent; font-family: inherit;
  }
  button { background: #37474f; color: #fff; cursor: pointer; border: none; }
  button:hover { background: #1c262b; }
  button.on { background: #c0392b; }
  button.save { background: #2e7d32; }
  button.reset { background: #ef6c00; }
  select, input { background: #fff; color: #000; border: 1px solid #c2c2c2; }
  .sep { width: 1px; height: 22px; background: #ddd; margin: 0 2px; }
  .main { flex: 1; display: flex; min-height: 0; }
  .wrap { flex: 1; overflow: auto; padding: 24px; display: flex; justify-content: center; align-items: flex-start; }
  .stage { background: #fff; box-shadow: 0 2px 14px rgba(0,0,0,.14); padding: 20px; }
  canvas { display: block; }
  canvas.editing { cursor: default; }

  /* 属性面板 */
  .panel {
    width: 268px; flex-shrink: 0; background: #fff;
    border-left: 1px solid #d5d5d5; overflow-y: auto; padding: 14px;
  }
  .panel h3 { margin: 0 0 4px; font-size: 14px; }
  .panel .sub { font-size: 12px; color: #777; margin-bottom: 12px; word-break: break-all; }
  .row { margin-bottom: 10px; }
  .row label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
  .row input, .row textarea, .row select {
    width: 100%; padding: 6px 8px; font-size: 13px;
    border: 1px solid #c2c2c2; border-radius: 4px; font-family: inherit;
  }
  .row textarea { resize: vertical; min-height: 54px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
  .grid2 .row input { width: 100%; }
  .row input:disabled { background: #f2f2f2; color: #999; }
  .empty { color: #999; font-size: 13px; line-height: 1.7; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .chk input { width: auto; }
  kbd {
    background: #eee; border: 1px solid #ccc; border-bottom-width: 2px;
    border-radius: 3px; padding: 0 4px; font-size: 11px; font-family: monospace;
  }
</style>
</head>
<body>

<div class="bar">
  <select id="pick"></select>
  <div class="sep"></div>
  <button id="edit">编辑模式</button>
  <select id="addShape" title="添加元素">
    <option value="">+ 添加元素</option>
    <option value="rect">矩形</option>
    <option value="ellipse">椭圆 / 用例</option>
    <option value="diamond">菱形 / 判断</option>
    <option value="terminator">圆角 / 起止</option>
    <option value="io">平行四边形</option>
    <option value="actor">参与者</option>
    <option value="label">纯文字</option>
    <option value="group">虚线分组框</option>
  </select>
  <button id="del">删除</button>
  <button id="link" title="选中两个元素后点此按钮连线">连线</button>
  <div class="sep"></div>
  <select id="alignPick" title="对齐与分布（需先多选）">
    <option value="">对齐 / 分布</option>
    <option value="a:left">左对齐</option>
    <option value="a:cx">水平居中</option>
    <option value="a:right">右对齐</option>
    <option value="a:top">顶部对齐</option>
    <option value="a:cy">垂直居中</option>
    <option value="a:bottom">底部对齐</option>
    <option value="d:x">水平等间距</option>
    <option value="d:y">垂直等间距</option>
    <option value="s:wh">统一宽高</option>
    <option value="s:w">统一宽度</option>
    <option value="s:h">统一高度</option>
    <option value="g:snap">吸到 8px 网格</option>
  </select>
  <button id="gridBtn" title="拖动时对齐到 8px 网格">网格吸附</button>
  <div class="sep"></div>
  <button id="undo">撤销</button>
  <button id="redo">重做</button>
  <button id="save" class="save">保存</button>
  <button id="reset" class="reset">重置</button>
  <div class="sep"></div>
  <button id="png">导出 PNG</button>
  <select id="scale" title="导出倍率">
    <option value="2">2×</option>
    <option value="4" selected>4×</option>
    <option value="6">6×</option>
  </select>
  <button id="svg">导出 SVG</button>
  <button id="dump">导出代码</button>
  <span id="hint" style="font-size:12px;color:#666;margin-left:auto"></span>
</div>

<div class="main">
  <div class="wrap"><div class="stage"><canvas id="cv"></canvas></div></div>
  <div class="panel" id="panel"></div>
</div>

<script src="engine/core.js"></script>
<script src="engine/shapes.js"></script>
<script src="engine/links.js"></script>
<script src="engine/constraints.js"></script>
<script src="engine/renderer.js"></script>
<script src="engine/svg-export.js"></script>

<script src="data/_entity-factory.js"></script>
<script src="data/01-framework.js"></script>
<script src="data/02-architecture.js"></script>
<script src="data/03-module.js"></script>
<script src="data/04a-usecase-user.js"></script>
<script src="data/04b-usecase-admin.js"></script>
<script src="data/05a-entity-user.js"></script>
<script src="data/05b-entity-log.js"></script>
<script src="data/05c-entity-file.js"></script>
<script src="data/05d-entity-role.js"></script>
<script src="data/05e-entity-token.js"></script>
<script src="data/06-er.js"></script>
<script src="data/08-flowchart.js"></script>
<script src="data/09-sequence.js"></script>
<script src="data/10-chart.js"></script>

<script src="editor.js"></script>
</body>
</html>
