# ############################################################################
# 小程序专用后端（Spring Boot）
# 与通用版 springboot 的差别：
#   1. user 表多一个 openid 字段（微信登录用）
#   2. 多一个 POST /api/user/wxLogin：code 换 openid，没有账号就自动建
#   3. application.yml 多一段 wechat 配置
# 数据库：wxapp_db（对应 docs/scaffold_db_wxapp.sql）
# ############################################################################

# 服务器配置
server:
  port: 8080

# 数据源配置
spring:
  application:
    name: springboot-wxapp-scaffold
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wxapp_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: __DB_PASSWORD__
  # Jackson时间格式化
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis-Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 微信小程序配置
# create 生成项目时会自动写成本项目自己的值（也可手动改）；
# 这里保留占位符，避免把真实 secret 带进仓库。
# secret 相当于小程序的后端密码，只放在服务端 yml，不要写进前端代码或提交到公开仓库。
wechat:
  appid: __WECHAT_APPID__
  secret: __WECHAT_SECRET__

# JWT配置
jwt:
  secret: your-secret-key-at-least-256-bits-long-for-hs256-algorithm
  expiration: 86400000

# 文件上传路径
file:
  upload:
    path: ../../uploads
    url-prefix: /uploads
    max-size: 10485760

# 日志配置
logging:
  level:
    com.example: info
