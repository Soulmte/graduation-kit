<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毕业设计脚手架 — 在线安装</title>
  <style>
    :root {
      --surface-0: oklch(98% 0.008 30);
      --surface-1: oklch(96% 0.009 30);
      --surface-2: oklch(94% 0.01 30);
      --surface-3: oklch(93% 0.01 30);
      --surface-4: oklch(92% 0.01 30);
      --accent: oklch(58% 0.22 25);
      --accent-dim: oklch(50% 0.2 25);
      --text-primary: oklch(28% 0.015 30);
      --text-secondary: oklch(48% 0.012 30);
      --text-tertiary: oklch(62% 0.01 30);
      --border: oklch(88% 0.008 30);
      --success: oklch(65% 0.18 145);
      --warning: oklch(75% 0.15 85);
      --error: oklch(60% 0.22 25);
      
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      --font-mono: "SF Mono", Monaco, "Cascadia Code", Consolas, monospace;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 999px;
      
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font-sans);
      background: var(--surface-0);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: clamp(2rem, 5vw, 4rem) clamp(1rem, 3vw, 2rem);
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }
    
    @media (min-width: 1024px) {
      .container {
        grid-template-columns: 1fr 340px;
        align-items: start;
      }
    }
    
    .main-content {
      min-width: 0;
    }
    
    .summary-panel {
      display: none;
    }
    
    @media (min-width: 1024px) {
      .summary-panel {
        display: block;
        position: sticky;
        top: 2rem;
        background: var(--surface-1);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        box-shadow: var(--shadow-sm);
      }
      
      .summary-title {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      
      .summary-tree {
        background: var(--surface-0);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 1rem;
        margin-bottom: 1.5rem;
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        line-height: 1.6;
        color: var(--text-secondary);
        overflow-x: auto;
        white-space: pre;
      }
      
      .summary-cli {
        background: var(--surface-0);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 1rem;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        line-height: 1.5;
        color: var(--text-tertiary);
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      
      .summary-cli-label {
        font-size: 0.75rem;
        color: var(--text-tertiary);
        margin-bottom: 0.5rem;
        font-weight: 500;
      }
    }
    
    /* Header */
    .header {
      text-align: center;
      margin-bottom: clamp(3rem, 6vw, 5rem);
      grid-column: 1 / -1;
    }
    
    .logo {
      width: clamp(48px, 10vw, 64px);
      height: clamp(48px, 10vw, 64px);
      background: var(--accent);
      border-radius: 50%;
      margin: 0 auto clamp(1rem, 3vw, 1.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      color: var(--surface-0);
      box-shadow: var(--shadow-md);
    }
    
    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }
    
    .subtitle {
      font-size: clamp(0.875rem, 2.5vw, 1rem);
      color: var(--text-secondary);
      max-width: 480px;
      margin: 0 auto;
    }
    
    /* Form */
    .form-section {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: clamp(1.5rem, 4vw, 2rem);
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    
    .form-section-title {
      font-size: clamp(1rem, 3vw, 1.125rem);
      font-weight: 600;
      margin-bottom: 1.25rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .form-section-title::before {
      content: '';
      width: 4px;
      height: 1.2em;
      background: var(--accent);
      border-radius: var(--radius-pill);
    }
    
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    .form-group:last-child {
      margin-bottom: 0;
    }
    
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    
    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--surface-0);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.9375rem;
      font-family: var(--font-sans);
      transition: all 0.2s ease;
    }
    
    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px oklch(from var(--accent) l c h / 0.12);
    }
    
    input.error {
      border-color: var(--error);
    }
    
    input::placeholder {
      color: var(--text-tertiary);
    }
    
    .input-hint {
      font-size: 0.8125rem;
      color: var(--text-tertiary);
      margin-top: 0.375rem;
    }
    
    .input-error {
      font-size: 0.8125rem;
      color: var(--error);
      margin-top: 0.375rem;
      display: none;
    }
    
    .input-error.active {
      display: block;
    }
    
    .os-badge {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-left: 0.5rem;
      font-family: var(--font-mono);
    }
    
    /* Checkbox Group */
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.75rem;
    }
    
    .checkbox-item {
      position: relative;
    }
    
    .checkbox-item input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      background: var(--surface-0);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.875rem;
      font-weight: 500;
    }
    
    .checkbox-item input:checked + .checkbox-label {
      background: var(--surface-2);
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    
    .checkbox-indicator {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    
    .checkbox-item input:checked + .checkbox-label .checkbox-indicator {
      background: var(--accent);
      border-color: var(--accent);
    }
    
    .checkbox-indicator::after {
      content: '✓';
      color: var(--surface-0);
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0;
      transform: scale(0);
      transition: all 0.15s ease;
    }
    
    .checkbox-item input:checked + .checkbox-label .checkbox-indicator::after {
      opacity: 1;
      transform: scale(1);
    }
    
    .checkbox-label:hover {
      background: var(--surface-2);
      border-color: var(--accent);
    }
    
    /* Radio Group */
    .radio-group {
      display: grid;
      gap: 0.5rem;
    }
    
    .radio-item {
      position: relative;
    }
    
    .radio-item input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    
    .radio-label {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.875rem 1rem;
      background: var(--surface-0);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .radio-item input:checked + .radio-label {
      background: var(--surface-2);
      border-color: var(--accent);
    }
    
    .radio-indicator {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
      margin-top: 0.125rem;
    }
    
    .radio-item input:checked + .radio-label .radio-indicator {
      border-color: var(--accent);
    }
    
    .radio-indicator::after {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      transition: all 0.15s ease;
    }
    
    .radio-item input:checked + .radio-label .radio-indicator::after {
      opacity: 1;
      transform: scale(1);
    }
    
    .radio-content {
      flex: 1;
    }
    
    .radio-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.125rem;
    }
    
    .radio-desc {
      font-size: 0.8125rem;
      color: var(--text-tertiary);
      line-height: 1.4;
    }
    
    /* Button */
    .btn {
      width: 100%;
      padding: 1rem 1.5rem;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-pill);
      color: var(--surface-0);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    
    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      background: var(--accent-dim);
    }
    
    .btn:active:not(:disabled) {
      transform: translateY(0);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: var(--surface-0);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    
    .btn-secondary:hover:not(:disabled) {
      background: var(--surface-2);
      border-color: var(--text-tertiary);
    }
    
    /* Progress */
    .progress-section {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: clamp(1.5rem, 4vw, 2rem);
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      display: none;
    }
    
    .progress-section.active {
      display: block;
    }
    
    .progress-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    
    .progress-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--surface-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .progress-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: var(--surface-2);
      border-radius: var(--radius-pill);
      overflow: hidden;
      margin-bottom: 0.75rem;
    }
    
    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: var(--radius-pill);
      transition: width 0.3s ease;
      width: 0%;
    }
    
    .progress-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-family: var(--font-mono);
    }
    
    /* Success */
    .success-section {
      background: var(--surface-1);
      border: 1px solid var(--success);
      border-radius: var(--radius-lg);
      padding: clamp(1.5rem, 4vw, 2rem);
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
      display: none;
      text-align: center;
    }
    
    .success-section.active {
      display: block;
    }
    
    .success-icon {
      width: 64px;
      height: 64px;
      background: var(--success);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    
    .success-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    
    .success-desc {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }
    
    .file-info {
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    
    .file-info-row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }
    
    .file-info-row:last-child {
      border-bottom: none;
    }
    
    .file-info-label {
      color: var(--text-tertiary);
    }
    
    .file-info-value {
      color: var(--text-primary);
      font-family: var(--font-mono);
    }
    
    /* Error */
    .error-section {
      background: var(--surface-1);
      border: 1px solid var(--error);
      border-radius: var(--radius-lg);
      padding: clamp(1.5rem, 4vw, 2rem);
      margin-bottom: 1.5rem;
      display: none;
    }
    
    .error-section.active {
      display: block;
    }
    
    .error-title {
      color: var(--error);
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .error-message {
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.6;
    }
    
    /* Footer */
    .footer {
      text-align: center;
      padding: 2rem 0;
      color: var(--text-tertiary);
      font-size: 0.8125rem;
    }
    
    .footer a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    
    .footer a:hover {
      color: var(--text-primary);
    }
    
    /* Responsive */
    @media (max-width: 640px) {
      .checkbox-group {
        grid-template-columns: 1fr;
      }
    }
    
    @media (max-width: 1023px) {
      .main-content {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">GK</div>
      <h1>毕业设计脚手架</h1>
      <p class="subtitle">无需命令行，在线生成并下载完整项目包</p>
    </header>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Form -->
      <form id="configForm">
        <!-- 基本信息 -->
        <section class="form-section">
          <h2 class="form-section-title">基本信息</h2>
          <div class="form-group">
            <label for="projectName">项目目录名</label>
            <input type="text" id="projectName" name="projectName" placeholder="my-graduation-project" required>
            <div class="input-hint">支持英文、数字、连字符，不能有空格</div>
            <div class="input-error" id="projectNameError"></div>
          </div>
          
          <div class="form-group">
            <label for="template">项目模板</label>
            <div class="radio-group">
              <div class="radio-item">
                <input type="radio" id="template-clean" name="template" value="clean" checked>
                <label for="template-clean" class="radio-label">
                  <span class="radio-indicator"></span>
                  <div class="radio-content">
                    <div class="radio-title">干净脚手架</div>
                    <div class="radio-desc">只有登录注册、用户、公告、日志基础功能</div>
                  </div>
                </label>
              </div>
              <div class="radio-item">
                <input type="radio" id="template-trade" name="template" value="trade">
                <label for="template-trade" class="radio-label">
                  <span class="radio-indicator"></span>
                  <div class="radio-content">
                    <div class="radio-title">交易 Demo</div>
                    <div class="radio-desc">商家、商品、购物车、订单、支付、退款完整流程</div>
                  </div>
                </label>
              </div>
              <div class="radio-item">
              <input type="radio" id="template-booking" name="template" value="booking">
              <label for="template-booking" class="radio-label">
                <span class="radio-indicator"></span>
                <div class="radio-content">
                  <div class="radio-title">预约 Demo</div>
                  <div class="radio-desc">服务机构、排班、预约单、到店核销、评价</div>
                </div>
              </label>
            </div>
            <div class="radio-item">
              <input type="radio" id="template-agent" name="template" value="agent">
              <label for="template-agent" class="radio-label">
                <span class="radio-indicator"></span>
                <div class="radio-content">
                  <div class="radio-title">AI Agent Demo</div>
                  <div class="radio-desc">拖拽编排智能体、知识库检索、流式对话</div>
                </div>
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- 技术栈选择 -->
      <section class="form-section" id="techStack">
        <h2 class="form-section-title">技术栈</h2>
        
        <div class="form-group">
          <label>后端框架</label>
          <div class="radio-group">
            <div class="radio-item">
              <input type="radio" id="be-springboot" name="backend" value="springboot" checked>
              <label for="be-springboot" class="radio-label">
                <span class="radio-indicator"></span>
                <div class="radio-content">
                  <div class="radio-title">Spring Boot 3</div>
                  <div class="radio-desc">Java 17 + MyBatis-Plus，端口 8080</div>
                </div>
              </label>
            </div>
            <div class="radio-item">
              <input type="radio" id="be-express" name="backend" value="express">
              <label for="be-express" class="radio-label">
                <span class="radio-indicator"></span>
                <div class="radio-content">
                  <div class="radio-title">Express 4</div>
                  <div class="radio-desc">Node.js + mysql2，端口 8081</div>
                </div>
              </label>
            </div>
            <div class="radio-item">
              <input type="radio" id="be-flask" name="backend" value="flask">
              <label for="be-flask" class="radio-label">
                <span class="radio-indicator"></span>
                <div class="radio-content">
                  <div class="radio-title">Flask 3</div>
                  <div class="radio-desc">Python + PyMySQL，端口 8082</div>
                </div>
              </label>
            </div>
            <div class="radio-item">
              <input type="radio" id="be-go" name="backend" value="go">
              <label for="be-go" class="radio-label">
                <span class="radio-indicator"></span>
                <div class="radio-content">
                  <div class="radio-title">Gin</div>
                  <div class="radio-desc">Go 1.21 + database/sql，端口 8084</div>
                </div>
              </label>
            </div>
            <div class="radio-item">
              <input type="radio" id="be-dotnet" name="backend" value="dotnet">
              <label for="be-dotnet" class="radio-label">
                <span class="radio-indicator"></span>
                <div class="radio-content">
                  <div class="radio-title">ASP.NET Core</div>
                  <div class="radio-desc">C# / .NET 8 + MySql.Data，端口 8085</div>
                </div>
              </label>
            </div>
          </div>
        </div>
        
        <div class="form-group">
          <label>前端框架（可多选）</label>
          <div class="checkbox-group">
            <div class="checkbox-item">
              <input type="checkbox" id="fe-react" name="frontend" value="react" checked>
              <label for="fe-react" class="checkbox-label">
                <span class="checkbox-indicator"></span>
                <span>React 18</span>
              </label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="fe-vue-elementplus" name="frontend" value="vue-elementplus">
              <label for="fe-vue-elementplus" class="checkbox-label">
                <span class="checkbox-indicator"></span>
                <span>Vue + Element Plus</span>
              </label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="fe-vue-antd" name="frontend" value="vue-antd">
              <label for="fe-vue-antd" class="checkbox-label">
                <span class="checkbox-indicator"></span>
                <span>Vue + Ant Design</span>
              </label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="fe-vue-naive" name="frontend" value="vue-naive">
              <label for="fe-vue-naive" class="checkbox-label">
                <span class="checkbox-indicator"></span>
                <span>Vue + Naive UI</span>
              </label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="fe-uniapp" name="frontend" value="uniapp">
              <label for="fe-uniapp" class="checkbox-label">
                <span class="checkbox-indicator"></span>
                <span>uni-app 跨端</span>
              </label>
            </div>
            <div class="checkbox-item">
              <input type="checkbox" id="fe-wxapp" name="frontend" value="wxapp">
              <label for="fe-wxapp" class="checkbox-label">
                <span class="checkbox-indicator"></span>
                <span>微信小程序</span>
              </label>

      <!-- 数据库配置 -->
      <section class="form-section">
        <h2 class="form-section-title">数据库</h2>
        <div class="form-group">
          <label for="dbName">数据库名</label>
          <input type="text" id="dbName" name="dbName" placeholder="scaffold_db" value="scaffold_db" required>
          <div class="input-hint">生成的 SQL 文件将使用此名称</div>
          <div class="input-error" id="dbNameError"></div>

        <div class="form-group">
          <label for="dbPass">MySQL root 密码（可选）</label>
          <input type="password" id="dbPass" name="dbPass" placeholder="留空表示无密码">
          <div class="input-hint">将写入后端配置文件，本地开发用</div>
        </div>
      </section>

      <!-- Agent Skills -->
      <section class="form-section">
        <h2 class="form-section-title">Agent Skills</h2>
        <div class="form-group">
          <div class="checkbox-item">
            <input type="checkbox" id="installSkills" name="installSkills" checked>
            <label for="installSkills" class="checkbox-label">
              <span class="checkbox-indicator"></span>
              <span>包含 6 个核心 skill（需求定义、代码审查、论文写作等）<span class="os-badge" id="osBadge"></span></span>
            </label>
          </div>
        </div>
      </section>

      <!-- Submit Button -->
      <button type="submit" class="btn" id="submitBtn">
        <span>生成并下载项目包</span>
      </button>

    <!-- Progress -->
    <section class="progress-section" id="progressSection">
      <div class="progress-header">
        <div class="progress-spinner"></div>
        <div class="progress-title" id="progressTitle">正在准备...</div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText">初始化...</div>
    </section>

    <!-- Success -->
    <section class="success-section" id="successSection">
      <div class="success-icon">✓</div>
      <h3 class="success-title">打包完成</h3>
      <p class="success-desc">项目包已生成，浏览器将自动下载</p>
      <div class="file-info" id="fileInfo"></div>
      <button type="button" class="btn" id="downloadAgain">重新下载</button>
      <button type="button" class="btn btn-secondary" id="startOver" style="margin-top: 0.75rem;">创建新项目</button>
    </section>

    <!-- Error -->
    <section class="error-section" id="errorSection">
      <div class="error-title">
        <span>✕</span>
        <span>生成失败</span>
      </div>
      <div class="error-message" id="errorMessage"></div>
      <button type="button" class="btn btn-secondary" id="retryBtn" style="margin-top: 1rem;">返回重试</button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>
        开源项目 · 
        <a href="https://github.com/Soulmte/graduation-kit" target="_blank">GitHub</a> · 
        <a href="https://gitee.com/rain-drops/graduation-kit" target="_blank">Gitee</a>
      </p>

  </div>

  <!-- Summary Panel (desktop only) -->
  <aside class="summary-panel">
    <div class="summary-title">预览</div>
    <div class="summary-tree" id="summaryTree"></div>
    <div class="summary-cli-label">等价命令</div>
    <div class="summary-cli" id="summaryCli"></div>
  </aside>
</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    // Configuration
    const NPM_PACKAGE = 'graduation-kit';
    const NPM_VERSION = '1.1.5';
    const CDN_BASE = 'https://cdn.jsdelivr.net/npm';
    
    // Backend port mapping
    const BACKEND_PORTS = {
      springboot: 8080,
      express: 8081,
      flask: 8082,
      go: 8084,
      dotnet: 8085
    };
    
    // State
    let generatedBlob = null;
    let formData = null;
    
    // DOM Elements
    const form = document.getElementById('configForm');
    const progressSection = document.getElementById('progressSection');
    const successSection = document.getElementById('successSection');
    const errorSection = document.getElementById('errorSection');
    const progressBar = document.getElementById('progressBar');
    const progressTitle = document.getElementById('progressTitle');
    const progressText = document.getElementById('progressText');
    const submitBtn = document.getElementById('submitBtn');
    const summaryTree = document.getElementById('summaryTree');
    const summaryCli = document.getElementById('summaryCli');
    
    // OS Detection
    const isWindows = /Windows/i.test(navigator.userAgent);
    document.getElementById('osBadge').textContent = isWindows ? 'Windows' : 'Mac/Linux';
    
    // Load saved config from localStorage
    function loadSavedConfig() {
      try {
        const saved = localStorage.getItem('gk_lastConfig');
        if (saved) {
          const config = JSON.parse(saved);
          if (config.projectName) document.getElementById('projectName').value = config.projectName;
          if (config.backend) {
            const backendRadio = document.querySelector(`input[name="backend"][value="${config.backend}"]`);
            if (backendRadio) backendRadio.checked = true;
          }
          if (config.frontend && Array.isArray(config.frontend)) {
            config.frontend.forEach(fe => {
              const checkbox = document.querySelector(`input[name="frontend"][value="${fe}"]`);
              if (checkbox) checkbox.checked = true;
            });
          }
          if (config.template) {
            const templateRadio = document.querySelector(`input[name="template"][value="${config.template}"]`);
            if (templateRadio) templateRadio.checked = true;
          }
          // Don't restore dbPass for security
        }
      } catch (e) {
        console.warn('Failed to load saved config:', e);
      }
    }
    
    // Save config to localStorage
    function saveConfig(data) {
      try {
        const toSave = {
          projectName: data.projectName,
          backend: data.backend,
          frontend: data.frontend,
          template: data.template
        };
        localStorage.setItem('gk_lastConfig', JSON.stringify(toSave));
      } catch (e) {
        console.warn('Failed to save config:', e);
      }
    }
    
    // Auto-derive database name from project name
    const projectNameInput = document.getElementById('projectName');
    const dbNameInput = document.getElementById('dbName');
    let dbNameAutoDerive = true;
    
    projectNameInput.addEventListener('input', () => {
      if (dbNameAutoDerive) {
        const derived = projectNameInput.value.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_db';
        dbNameInput.value = derived;
        dbNameInput.setAttribute('data-auto', 'true');
      }
      updateSummary();
    });
    
    dbNameInput.addEventListener('input', () => {
      // User manually edited, stop auto-derive
      if (dbNameInput.value !== projectNameInput.value.toLowerCase().replace(/[^a-z0-9]/g, '_') + '_db') {
        dbNameAutoDerive = false;
        dbNameInput.removeAttribute('data-auto');
      }
      updateSummary();
    });
    
    // Inline validation
    function validateField(field) {
      const errorEl = document.getElementById(field.id + 'Error');
      if (!errorEl) return true;
      
      let error = '';
      
      if (field.id === 'projectName') {
        if (!field.value.trim()) {
          error = '项目名不能为空';
        } else if (!/^[a-zA-Z0-9_-]+$/.test(field.value.trim())) {
          error = '只能包含英文、数字、下划线和连字符';
        }
      } else if (field.id === 'dbName') {
        if (!field.value.trim()) {
          error = '数据库名不能为空';
        } else if (!/^[a-zA-Z0-9_]+$/.test(field.value.trim())) {
          error = '只能包含英文、数字、下划线';
        }
      }
      
      if (error) {
        errorEl.textContent = error;
        errorEl.classList.add('active');
        field.classList.add('error');
        return false;
      } else {
        errorEl.textContent = '';
        errorEl.classList.remove('active');
        field.classList.remove('error');
        return true;
      }
    }
    
    projectNameInput.addEventListener('blur', () => validateField(projectNameInput));
    dbNameInput.addEventListener('blur', () => validateField(dbNameInput));
    
    // Update summary panel
    function updateSummary() {
      const projectName = document.getElementById('projectName').value.trim() || 'my-project';
      const template = document.querySelector('input[name="template"]:checked')?.value || 'clean';
      const backend = document.querySelector('input[name="backend"]:checked')?.value || 'springboot';
      const frontends = Array.from(document.querySelectorAll('input[name="frontend"]:checked')).map(el => el.value);
      const dbName = document.getElementById('dbName').value.trim() || 'scaffold_db';
      const installSkills = document.getElementById('installSkills').checked;
      
      // Build tree
      let tree = `${projectName}/\n├── backend/\n`;
      
      if (template === 'clean') {
        if (frontends.length === 1) {
          tree += `├── frontend/\n`;
        } else if (frontends.length > 1) {
          frontends.forEach((fe, i) => {
            tree += `├── frontend-${fe}/\n`;
          });
        }
      } else {
        tree += `├── frontend/\n`;
      }
      
      tree += `├── docs/\n│   └── ${dbName}.sql\n├── uploads/\n`;
      
      if (installSkills) {
        tree += `├── install-skills.${isWindows ? 'bat' : 'sh'}\n`;
      }
      
      tree += `└── README.md`;
      
      summaryTree.textContent = tree;
      
      // Build CLI equivalent
      const beFlag = template === 'clean' ? ` --backend ${backend}` : '';
      const feFlag = template === 'clean' && frontends.length > 0 ? ` --frontend ${frontends.join(',')}` : '';
      const templateFlag = template !== 'clean' ? ` --template ${template}` : '';
      const dbFlag = dbName !== 'scaffold_db' ? ` --db-name ${dbName}` : '';
      const skillsFlag = !installSkills ? ' --no-skills' : '';
      
      summaryCli.textContent = `npx graduation-kit@${NPM_VERSION} ${projectName}${beFlag}${feFlag}${templateFlag}${dbFlag}${skillsFlag}`;
    }
    
    // Listen to form changes
    document.querySelectorAll('input[name="template"], input[name="backend"], input[name="frontend"], input[name="installSkills"]').forEach(el => {
      el.addEventListener('change', updateSummary);
    });
    
    // Initialize
    loadSavedConfig();
    updateSummary();
    
    // Template selection handler
    document.querySelectorAll('input[name="template"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const techStack = document.getElementById('techStack');
        if (['trade', 'booking', 'agent'].includes(e.target.value)) {
          techStack.style.opacity = '0.5';
          techStack.style.pointerEvents = 'none';
        } else {
          techStack.style.opacity = '1';
          techStack.style.pointerEvents = 'auto';
        }
      });
    });
    
    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Validate all fields
      const projectNameValid = validateField(projectNameInput);
      const dbNameValid = validateField(dbNameInput);
      
      if (!projectNameValid || !dbNameValid) {
        return;
      }
      
      // Collect form data
      formData = {
        projectName: document.getElementById('projectName').value.trim(),
        template: document.querySelector('input[name="template"]:checked').value,
        backend: document.querySelector('input[name="backend"]:checked').value,
        frontend: Array.from(document.querySelectorAll('input[name="frontend"]:checked')).map(el => el.value),
        dbName: document.getElementById('dbName').value.trim(),
        dbPass: document.getElementById('dbPass').value,
        installSkills: document.getElementById('installSkills').checked
      };
      
      // Validate
      if (formData.template === 'clean' && formData.frontend.length === 0) {
        const errorEl = document.createElement('div');
        errorEl.className = 'input-error active';
        errorEl.textContent = '请至少选择一个前端框架';
        document.querySelector('.checkbox-group').parentElement.appendChild(errorEl);
        setTimeout(() => errorEl.remove(), 3000);
        return;
      }
      
      // Save config
      saveConfig(formData);
      
      // Show progress
      form.style.display = 'none';
      progressSection.classList.add('active');
      submitBtn.disabled = true;
      
      try {
        await generateProject();
      } catch (err) {
        console.error(err);
        showError(err.message || '生成失败，请重试');
      } finally {
        submitBtn.disabled = false;
      }
    });
    
    // Button handlers
    document.getElementById('downloadAgain').addEventListener('click', () => {
      if (generatedBlob) {
        downloadBlob(generatedBlob, `${formData.projectName}.zip`);
      }
    });
    
    document.getElementById('startOver').addEventListener('click', () => {
      location.reload();
    });
    
    document.getElementById('retryBtn').addEventListener('click', () => {
      errorSection.classList.remove('active');
      form.style.display = 'block';
    });
    
    // Main generation logic
    async function generateProject() {
      // Step 1: Get file list from CDN
      updateProgress(10, '获取文件列表', '正在从 CDN 拉取 npm 包结构...');
      
      const API_BASE = 'https://data.jsdelivr.com/v1/packages';
      const listRes = await fetch(`${API_BASE}/npm/${NPM_PACKAGE}@${NPM_VERSION}?structure=flat`);
      
      if (!listRes.ok) {
        throw new Error(`获取文件列表失败: ${listRes.status} - 请检查网络或稍后重试`);
      }
      
      let data;
      try {
        data = await listRes.json();
      } catch (e) {
        throw new Error(`CDN 返回了非预期格式，请稍后重试`);
      }
      
      const allFiles = data.files
        .filter(f => !f.name.startsWith('/.git'))
        .map(f => ({
          path: f.name.replace(/^\//, ''),
          size: f.size
        }));
      
      // Step 2: Determine what to download based on template
      updateProgress(20, '筛选所需文件', '根据您的配置过滤文件...');
      
      const neededFiles = filterFiles(allFiles);
      
      if (neededFiles.length === 0) {
        throw new Error('没有找到需要的文件，请检查配置');
      }
      
      // Step 3: Download and process files
      updateProgress(30, '下载文件', `准备下载 ${neededFiles.length} 个文件...`);
      
      const zip = new JSZip();
      const total = neededFiles.length;
      
      for (let i = 0; i < total; i++) {
        const file = neededFiles[i];
        const progress = 30 + (i / total) * 50;
        updateProgress(
          progress,
          '下载文件',
          `正在下载: ${file.targetPath} (${i + 1}/${total})`
        );
        
        const content = await downloadFile(file.path);
        const processed = processFileContent(content, file);
        zip.file(file.targetPath, processed);
      }
      
      // Step 4: Add install-skills script (OS-specific)
      updateProgress(85, '添加安装脚本', '下载 Skills 安装脚本...');
      
      if (formData.installSkills) {
        const scriptName = isWindows ? 'install-skills.bat' : 'install-skills.sh';
        const scriptContent = await downloadFile(scriptName);
        zip.file(scriptName, scriptContent);
      }
      
      // Step 5: Generate README
      updateProgress(90, '生成说明文档', '创建使用指南...');
      
      const readme = generateReadme();
      zip.file('README.md', readme);
      
      // Step 6: Package zip
      updateProgress(95, '打包 ZIP', '正在压缩文件...');
      
      generatedBlob = await zip.generateAsync({
        type: 'blob',
        compression: 'DEFLATE',
        compressionOptions: { level: 6 }
      });
      
      updateProgress(100, '完成', '项目包已生成');
      
      // Show success
      setTimeout(() => {
        progressSection.classList.remove('active');
        successSection.classList.add('active');
        
        const sizeKB = (generatedBlob.size / 1024).toFixed(1);
        document.getElementById('fileInfo').innerHTML = `
          <div class="file-info-row">
            <span class="file-info-label">文件名</span>
            <span class="file-info-value">${formData.projectName}.zip</span>
          </div>
          <div class="file-info-row">
            <span class="file-info-label">大小</span>
            <span class="file-info-value">${sizeKB} KB</span>
          </div>
          <div class="file-info-row">
            <span class="file-info-label">文件数</span>
            <span class="file-info-value">${neededFiles.length + (formData.installSkills ? 2 : 1)} 个</span>
          </div>
          ${formData.installSkills ? `
          <div class="file-info-row">
            <span class="file-info-label">Skills 安装</span>
            <span class="file-info-value">解压后运行 install-skills 脚本</span>
          </div>
          ` : ''}
        `;
        
        // Auto download
        downloadBlob(generatedBlob, `${formData.projectName}.zip`);
      }, 500);
    }
    
    // Map source paths to flat target paths
    function filterFiles(allFiles) {
      const needed = [];
      const seen = new Set();
      
      const add = (file, targetPath, meta) => {
        if (seen.has(targetPath)) return;
        seen.add(targetPath);
        needed.push({ path: file.path, targetPath, ...meta });
      };
      
      if (formData.template === 'clean') {
        // backend: src/scaffolds/backends/<id>/** -> backend/**
        const bePrefix = `src/scaffolds/backends/${formData.backend}/`;
        for (const file of allFiles) {
          if (file.path.startsWith(bePrefix)) {
            add(file, 'backend/' + file.path.slice(bePrefix.length), { role: 'backend' });
          }
        }
        
        // frontend: single -> frontend/, multiple -> frontend-<id>/
        const feTotal = formData.frontend.length;
        for (const fe of formData.frontend) {
          const fePrefix = `src/scaffolds/frontends/${fe}/`;
          const feDir = feTotal === 1 ? 'frontend' : `frontend-${fe}`;
          for (const file of allFiles) {
            if (file.path.startsWith(fePrefix)) {
              add(file, `${feDir}/` + file.path.slice(fePrefix.length), { role: 'frontend', feId: fe });
            }
          }
        }
        
        // docs + uploads
        for (const file of allFiles) {
          if (file.path.startsWith('src/scaffolds/docs/')) {
            const rel = file.path.slice('src/scaffolds/docs/'.length);
            const target = rel === 'scaffold_db.sql' ? `docs/${formData.dbName}.sql` : `docs/${rel}`;
            add(file, target, { role: 'sql' });
          } else if (file.path.startsWith('src/scaffolds/uploads/')) {
            add(file, 'uploads/' + file.path.slice('src/scaffolds/uploads/'.length), { role: 'asset' });
          }
        }
      } else {
        // Demo templates ship their own backend/frontend/docs
        const demoPrefix = `src/scaffolds/demos/${formData.template}/`;
        for (const file of allFiles) {
          if (!file.path.startsWith(demoPrefix)) continue;
          const rel = file.path.slice(demoPrefix.length);
          
          if (rel.startsWith('docs/')) {
            const docRel = rel.slice('docs/'.length);
            const target = docRel === 'scaffold_db.sql' ? `docs/${formData.dbName}.sql` : `docs/${docRel}`;
            add(file, target, { role: 'sql' });
          } else if (rel.startsWith('backend/')) {
            add(file, rel, { role: 'backend' });
          } else if (rel.startsWith('frontend/')) {
            add(file, rel, { role: 'frontend', feId: 'vue-antd' });
          } else {
            add(file, rel, { role: 'asset' });
          }
        }
        
        // Demos still need the shared uploads placeholder
        for (const file of allFiles) {
          if (file.path.startsWith('src/scaffolds/uploads/')) {
            add(file, 'uploads/' + file.path.slice('src/scaffolds/uploads/'.length), { role: 'asset' });
          }
        }
      }
      
      return needed;
    }
    
    // Text files get placeholder substitution; everything else stays binary
    const TEXT_EXT = /\.(java|js|mjs|cjs|jsx|ts|tsx|vue|py|go|cs|json|yml|yaml|xml|sql|md|txt|html|css|scss|less|properties|env|sh|bat|gitignore|wxss|wxml|conf|toml|csproj|sln|mod|sum)$/i;
    const TEXT_NAMES = new Set(['.env', '.env.development', '.env.production', '.gitignore', 'Dockerfile', 'Makefile']);
    
    function isTextFile(targetPath) {
      const name = targetPath.split('/').pop();
      return TEXT_NAMES.has(name) || TEXT_EXT.test(name);
    }
    
    async function downloadFile(sourcePath) {
      const res = await fetch(`${CDN_BASE}/${NPM_PACKAGE}@${NPM_VERSION}/${sourcePath}`);
      if (!res.ok) {
        throw new Error(`下载失败: ${sourcePath} (${res.status})`);
      }
      const arrayBuffer = await res.arrayBuffer();
      return new Uint8Array(arrayBuffer);
    }
    
    // Apply the same substitutions the CLI does, minus one directory level for uploads
    function processFileContent(bytes, file) {
      if (!isTextFile(file.targetPath)) return bytes;
      
      let text;
      try {
        text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch {
        return bytes; // Not valid UTF-8, treat as binary
      }
      
      const port = BACKEND_PORTS[formData.template === 'clean' ? formData.backend : 'springboot'] || 8080;
      const name = file.targetPath.split('/').pop();
      const edits = [];
      
      if (file.role === 'backend') {
        edits.push(['__DB_PASSWORD__', name.endsWith('.yml') || name.endsWith('.yaml')
          ? escapeYaml(formData.dbPass)
          : formData.dbPass]);
        edits.push(['DB_NAME=scaffold_db', `DB_NAME=${formData.dbName}`]);
        edits.push(['/scaffold_db?', `/${formData.dbName}?`]);
        // Scaffold nests backend one level deeper than the generated project
        edits.push(['UPLOAD_DIR=../../uploads', 'UPLOAD_DIR=../uploads']);
        edits.push(['path: ../../uploads', 'path: ../uploads']);
        edits.push(["'../../uploads'", "'../uploads'"]);
        edits.push(['"../../uploads"', '"../uploads"']);
        edits.push(["'../../../uploads'", "'../../uploads'"]);
        edits.push(["'../../../../uploads'", "'../../../uploads'"]);
      } else if (file.role === 'frontend') {
        edits.push(['http://localhost:8080', `http://localhost:${port}`]);
        if (port !== 8080) edits.push([':8080', `:${port}`]);
      } else if (file.role === 'sql') {
        edits.push(['`scaffold_db`', '`' + formData.dbName + '`']);
        edits.push(['数据库：scaffold_db', `数据库：${formData.dbName}`]);
        edits.push(['< scaffold_db.sql', `< docs/${formData.dbName}.sql`]);
      }
      
      for (const [from, to] of edits) {
        if (from && text.includes(from)) text = text.split(from).join(to);
      }
      
      return text;
    }
    
    function escapeYaml(password) {
      if (!password) return '';
      if (/^[A-Za-z0-9_.-]+$/.test(password)) return password;
      return '"' + password.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    }
    
    // Generate README
    function generateReadme() {
      const beLabel = {
        springboot: 'Spring Boot 3 (Java)',
        express: 'Express 4 (Node.js)',
        flask: 'Flask 3 (Python)',
        go: 'Gin (Go)',
        dotnet: 'ASP.NET Core (C#)'
      }[formData.template === 'clean' ? formData.backend : 'springboot'] || formData.backend;
      
      const feLabels = formData.template === 'clean'

    // Download blob as file
    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
